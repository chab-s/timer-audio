<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Timer</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10141D">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        :root {
            --background: #10141D;
            --text-color: #FFFFFF;
            --accent-color: #6EA292;
            --input-background: #2B9076;

            --timer-size: clamp(32px, 11vw, 72px);
            --button-radius: 12px;
            --interface-spacing: 20px;
        }

        body {
            background: var(--background);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 60px 20px;
        }

        #delayDisplay {
            font-size: clamp(16px, 5vw, 28px);
            font-family: monospace;
            font-variant-numeric: tabular-nums;
            color: var(--text-color);
            height: 1.4em;
            margin-top: 30px;
        }

        #timerDisplay {
            font-size: var(--timer-size);
            font-family: monospace;
            color: var(--accent-color);
            font-variant-numeric: tabular-nums;
            margin: 40px 0;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        button {
            background: var(--accent-color);
            color: var(--background);
            border: none;
            border-radius: var(--button-radius);
            padding: 15px 35px;
            font-size: 18px;
            cursor: pointer;
        }

        .settings {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin: 30px 0;
        }

        .settings .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 14px;
        }

        .settings input {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid white;
            background: var(--input-background);
            color: var(--text-color);
            font-size: 16px;
            text-align: center;
        }

        .time-inputs {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .time-inputs input {
            width: 55px;
            padding: 10px 5px;
            text-align: center;
        }
    </style>

</head>
<body>
    <h1>Timer</h1>

    <div class="settings">

        <div class="field" role="group" aria-labelledby="delayLabel">
            <span id="delayLabel">Time before start</span>
            <div class="time-inputs">
                <input type="number" id="delayMinutes" value="0" min="0" aria-label="Minutes before start" oninput="updatePreview()">
                <span>min</span>
                <input type="number" id="delaySeconds" value="10" min="0" max="59" aria-label="Seconds before start" oninput="updatePreview()">
                <span>s</span>
            </div>
        </div>

        <div class="field" role="group" aria-labelledby="durationLabel">
            <span id="durationLabel">Total Time</span>
            <div class="time-inputs">
                <input type="number" id="durationMinutes" value="20" min="0" aria-label="Total minutes" oninput="updatePreview()">
                <span>min</span>
                <input type="number" id="durationSeconds" value="0" min="0" max="59" aria-label="Total seconds" oninput="updatePreview()">
                <span>s</span>
            </div>
        </div>

        <div class="field" role="group" aria-labelledby="beepLabel">
            <span id="beepLabel">Beep interval</span>
            <div class="time-inputs">
                <input type="number" id="beepMinutes" value="1" min="0" aria-label="Beep interval minutes" oninput="updatePreview()">
                <span>min</span>
                <input type="number" id="beepSeconds" value="30" min="0" max="59" aria-label="Beep interval seconds" oninput="updatePreview()">
                <span>s</span>
            </div>
        </div>

    </div>

    <div id="delayDisplay"></div>
    <div id="timerDisplay"></div>

    <div class="button-container">
        <button id="mainButton" onclick="handleTimerButton()">START</button>
        <button id="testBeepButton" onclick="testBeep()">TEST BEEP</button>
    </div>

    <script>

    const CONFIG = {
      // SON
      soundEnabled: true,
      soundAtEnd: true,

      // BIPS
      beepFrequency: 880,
      beepDuration: 0.12,

      // Rempli depuis les champs de saisie (en secondes)
      defaultDelay: 0,
      defaultDuration: 0,
      beepInterval: 0
    };

    const TICK_MS = 100;

    let TIMER = {
      status: "idle",   // idle | waiting | running | finished
      startTime: null,
      targetTime: null,
      endTime: null,
      remainingTime: 0
    };
    let audioContext = null;
    let intervalId = null;
    let scheduledOscs = [];
    let wakeLock = null;

    function isRunning() {
      return TIMER.status === "waiting" || TIMER.status === "running";
    }

    /* ---------- Son ---------- */

    function playBeep(when) {
      if (!CONFIG.soundEnabled || !audioContext) return null;

      const t = when ?? audioContext.currentTime;
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.type = "sine";
      oscillator.frequency.value = CONFIG.beepFrequency;

      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.3, t + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + CONFIG.beepDuration);

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.start(t);
      oscillator.stop(t + CONFIG.beepDuration + 0.02);
      return oscillator;
    }

    function scheduleBeeps() {
      if (!audioContext) return;

      const base = audioContext.currentTime + CONFIG.defaultDelay;
      const interval = CONFIG.beepInterval;
      const duration = CONFIG.defaultDuration;

      if (interval > 0) {
        for (let k = 0; k * interval < duration - 0.001; k++) {
          scheduledOscs.push(playBeep(base + k * interval));
        }
      }
      if (CONFIG.soundAtEnd) {
        scheduledOscs.push(playBeep(base + duration));
      }
    }

    function cancelBeeps() {
      scheduledOscs.forEach(o => { try { o && o.stop(); } catch (e) {} });
      scheduledOscs = [];
    }

    async function initAudio() {
      if (navigator.audioSession) navigator.audioSession.type = "playback";

      const AudioContextClass = window.AudioContext || window.webkitAudioContext;

      if (AudioContextClass && !audioContext) {
        audioContext = new AudioContextClass();
      }

      if (audioContext && audioContext.state === "suspended") {
        await audioContext.resume();
      }

      console.log("Audio context:", audioContext?.state);
    }

    async function testBeep() {
      if (isRunning()) return;
      await initAudio();
      playBeep();
    }

    /* ---------- Écran toujours allumé ---------- */

    async function requestWakeLock() {
      if (!("wakeLock" in navigator) || wakeLock) return;

      try {
        const lock = await navigator.wakeLock.request("screen");

        // Si le chrono a été remis à zéro pendant l'attente, on relâche aussitôt
        if (!isRunning()) {
          lock.release().catch(() => {});
          return;
        }

        wakeLock = lock;
        lock.addEventListener("release", () => {
          if (wakeLock === lock) wakeLock = null;
        });
      } catch (e) {
        console.log("WakeLock:", e);
      }
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().catch(() => {});
        wakeLock = null;
      }
    }

    // Le verrou est perdu quand l'onglet est caché : on le redemande au retour
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && isRunning()) {
        requestWakeLock();
        updateTimer();
      }
    });

    /* ---------- Lecture des champs ---------- */

    function readNumber(id, fallback, min = 0) {
      const value = Number(document.getElementById(id).value);
      return Number.isFinite(value) && value >= min ? value : fallback;
    }

    function readTime(minutesId, secondsId) {
      const minutes = readNumber(minutesId, 0);
      const seconds = readNumber(secondsId, 0);

      return minutes * 60 + seconds;
    }

    function updateConfigFromInput() {
      CONFIG.defaultDelay = readTime("delayMinutes", "delaySeconds");
      CONFIG.defaultDuration = readTime("durationMinutes", "durationSeconds");
      CONFIG.beepInterval = readTime("beepMinutes", "beepSeconds");
    }

    /* ---------- Chronomètre ---------- */

    async function startTimer() {
      if (TIMER.status !== "idle" && TIMER.status !== "finished") {
        return;
      }

      updateConfigFromInput();

      if (CONFIG.defaultDuration <= 0) return;

      TIMER.remainingTime = CONFIG.defaultDuration * 1000;

      await initAudio();

      cancelBeeps();
      scheduleBeeps();

      TIMER.startTime = Date.now();
      TIMER.targetTime = TIMER.startTime + CONFIG.defaultDelay * 1000;
      TIMER.status = "waiting";

      requestWakeLock();

      intervalId = setInterval(updateTimer, TICK_MS);
      updateTimer();
    }

    function resetTimer() {
      if (intervalId !== null) {
        clearInterval(intervalId);
        intervalId = null;
      }
      cancelBeeps();
      releaseWakeLock();

      TIMER.status = "idle";
      TIMER.startTime = null;
      TIMER.targetTime = null;
      TIMER.endTime = null;
      TIMER.remainingTime = CONFIG.defaultDuration * 1000;

      renderTimer();
    }

    function handleTimerButton() {
      if (TIMER.status === "idle" || TIMER.status === "finished") {
        startTimer();
      } else {
        resetTimer();
      }
    }

    function updatePreview() {
      if (isRunning()) return;

      TIMER.status = "idle"; // sort de l'état "finished" si besoin
      updateConfigFromInput();
      TIMER.remainingTime = CONFIG.defaultDuration * 1000;

      renderTimer();
    }

    function updateTimer() {
      const now = Date.now();

      if (TIMER.status === "waiting" && now >= TIMER.targetTime) {
        TIMER.status = "running";
        TIMER.endTime = TIMER.targetTime + CONFIG.defaultDuration * 1000;
        console.log("Countdown Started");
      }

      if (TIMER.status === "running") {
        TIMER.remainingTime = Math.max(0, TIMER.endTime - now);

        if (TIMER.remainingTime <= 0) {
          TIMER.status = "finished";
          clearInterval(intervalId);
          intervalId = null;
          releaseWakeLock();
          console.log("Countdown Finished");
        }
      }

      renderTimer();
    }

    /* ---------- Affichage ---------- */

    function formatSmartTime(milliseconds) {
      const totalSeconds = Math.ceil(milliseconds / 1000);

      if (totalSeconds < 60) {
        return totalSeconds + " s";
      }

      const seconds = totalSeconds % 60;
      const totalMinutes = Math.floor(totalSeconds / 60);

      if (totalMinutes < 60) {
        return totalMinutes + " min " + String(seconds).padStart(2, "0") + " s";
      }

      const minutes = totalMinutes % 60;
      const hours = Math.floor(totalMinutes / 60);

      return hours + " h " + String(minutes).padStart(2, "0") + " min";
    }

    function renderTimer() {
      const display = document.getElementById("timerDisplay");
      const button = document.getElementById("mainButton");
      const testButton = document.getElementById("testBeepButton");
      const delayDisplay = document.getElementById("delayDisplay");

      display.textContent = formatSmartTime(TIMER.remainingTime);

      let delayMs = null;

      if (TIMER.status === "waiting") {
        delayMs = Math.max(0, TIMER.targetTime - Date.now());
      } else if (TIMER.status === "idle") {
        delayMs = readTime("delayMinutes", "delaySeconds") * 1000;
      }

      delayDisplay.textContent =
        delayMs === null ? "" : "Start in " + formatSmartTime(delayMs);

      button.textContent = isRunning() ? "RESET" : "START";

      const locked = isRunning();
      testButton.disabled = locked;
      testButton.style.opacity = locked ? "0.4" : "1";
      testButton.style.cursor = locked ? "not-allowed" : "pointer";
    }

    updatePreview();
    </script>
</body>
</html>
